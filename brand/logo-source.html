<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
  body.avatar { background: #09090B; }
  body.avatar::before {
    content: ''; position: absolute; width: 80vw; height: 80vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.35), transparent 65%);
  }
  .mark { position: relative; flex-shrink: 0; }
  .lockup { display: flex; align-items: center; gap: 0.28em; font-size: var(--fs); }
  .lockup .mark { width: 2.45em; height: 2.45em; }
  .words { display: flex; flex-direction: column; line-height: 1; }
  .w1 { font-family: Manrope; font-weight: 800; font-size: 1em; letter-spacing: 0.02em; }
  .w2 {
    font-family: Manrope; font-weight: 800; font-size: 0.42em; letter-spacing: 0.32em; margin-top: 0.42em;
    background: linear-gradient(90deg, #FDBA74, #F97316 60%, #FB923C);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .on-dark .w1 { color: #FAFAFA; }
  .on-light .w1 { color: #0B0B0E; }
  .on-light .w2 { background: linear-gradient(90deg, #EA580C, #F97316); -webkit-background-clip: text; background-clip: text; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <symbol id="sprint-mark" viewBox="0 0 512 512">
      <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#shine)"/>
      <!-- speed streaks -->
      <g stroke="#FFFFFF" stroke-linecap="round">
        <line x1="236" y1="250" x2="292" y2="182" stroke-width="22" opacity="0.6"/>
        <line x1="178" y1="226" x2="216" y2="180" stroke-width="18" opacity="0.4"/>
      </g>
      <!-- rising traffic line with arrow -->
      <polyline points="104,372 204,282 268,330 384,190" fill="none" stroke="#FFFFFF"
                stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M318 168 L412 160 L404 254 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div id="root"></div>

<script>
  const v = location.hash.slice(1) || 'icon';
  const mark = '<svg class="mark" viewBox="0 0 512 512"><use href="#sprint-mark"/></svg>';
  const root = document.getElementById('root');
  if (v === 'icon') {
    root.innerHTML = mark;
    root.querySelector('.mark').style.cssText = 'width:96vw;height:96vw';
  } else if (v === 'avatar') {
    document.body.classList.add('avatar');
    root.innerHTML = mark;
    root.querySelector('.mark').style.cssText = 'width:52vw;height:52vw';
  } else {
    const dark = v === 'horizontal-dark';
    root.innerHTML = '<div class="lockup ' + (dark ? 'on-dark' : 'on-light') + '">' + mark +
      '<div class="words"><span class="w1">СПРИНТ</span><span class="w2">ПО ТРАФИКУ</span></div></div>';
    root.querySelector('.lockup').style.setProperty('--fs', '18vh');
  }
</script>
</body>
</html>
